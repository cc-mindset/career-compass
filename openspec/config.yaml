schema: spec-driven

context: |
  Repo is a multi-surface monorepo with openspec/ for planning artifacts.
  web-server is the TypeScript/Express backend; it owns API routes, Redis queueing, websocket progress, and MongoDB-backed LLM cache/models.
  web-server uses Pinecone for RAG retrieval context and Redis for job queueing/cache coordination.
  client/client/app is the active Vite + React + TypeScript frontend for the guest-first Clarity Coach prototype; it preserves hash routes and prototype class names.
  client/legacy-client/app is a separate older Vite + React + TypeScript app; it has Jest/ts-jest and React Testing Library, with tests under src/views/auth/__test__.
  serverless is a separate Serverless Framework package for scheduled jobs (index.js, serverless.yml).
  Testing: web-server uses Vitest with supertest; client/client/app has lint only in package.json; legacy-client uses Jest; no top-level ai-enabler test runner was checked.
  Naming/structure: runtime-specific folders stay separate by surface, and web-server follows routes/, services/, db/, lib/, types/, and utils/ conventions.

