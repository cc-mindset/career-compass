schema: spec-driven

context: |
  Repo is a multi-surface monorepo with openspec/ for planning artifacts.
  web-server is the TypeScript/Express backend; it owns API routes, Redis queueing, websocket progress, and MongoDB-backed LLM cache/models.
  web-server uses Pinecone for RAG retrieval context and Redis for job queueing/cache coordination.
  client/client/app is the active Vite + React + TypeScript frontend for the guest-first Clarity Coach prototype; it preserves hash routes and prototype class names.
  client/legacy-client/app is a separate older Vite + React + TypeScript app; do not mix into active feature work unless requested.
  serverless is a separate Serverless Framework package for scheduled jobs.
  Testing: web-server Vitest (npm test / npm run test:core); active client Vitest (npm test / npm run test:core) + Playwright (e2e:pulse / e2e:smoke / e2e:p0).
  Apply / implement via TDD: failing unit test before production code for logic-shaped work;
  focused Vitest as the inner gate; AGENTS.md Playwright ladder as the outer gate before apply-complete.
  Naming/structure: web-server follows routes/, services/, db/, lib/, types/, utils/; active client uses src/views/, src/state/, src/components/.

rules:
  tasks:
    - Order logic work as TDD pairs: failing unit test task, then implement-until-green task (focused Vitest). Do not put a Tests section after all production tasks.
    - Include an outer-gate section: Playwright add/update when UI or API-for-UI is touched, then e2e:pulse (+ e2e:p0 / e2e:smoke per AGENTS.md).
    - Keep investigation/manual staging checks separate from the TDD pairs.
  design:
    - When the change is logic-shaped, document the TDD + self-validation ladder (focused Vitest inner gate, Playwright outer gate) under Decisions.
  proposal:
    - Call out that apply uses TDD / AGENTS.md self-validation when the change includes helpers, adapters, merge/dedup, or API/client logic.

operations:
  apply:
    guidance:
      - For logic-shaped tasks: failing Vitest first, then implement until green; re-run focused Vitest before the next task.
      - When product UI or API-for-UI changes: add/update Playwright coverage and run the AGENTS.md ladder before claiming apply-complete.
      - Do not chase repository-wide coverage percentages.
  archive:
    guidance:
      - Confirm inner/outer gates were green (or explicitly documented as out of scope) before archiving.
