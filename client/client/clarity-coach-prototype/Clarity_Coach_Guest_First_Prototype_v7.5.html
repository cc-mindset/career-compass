<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Clarity Coach Guest-First Prototype v7.4</title>
  <style>
    :root{
      --ink:#10233f;--muted:#617087;--blue:#1769e0;--blue2:#0e56bd;--paper:#fff;
      --wash:#f5f7fb;--line:#dbe2eb;--green:#087b55;--greenwash:#eaf7f1;
      --amber:#a85f00;--amberwash:#fff5e4;--purple:#6952ca;--shadow:0 16px 45px rgba(21,42,75,.10);
      --radius:14px;--max:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;color:var(--ink);background:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button,a{cursor:pointer}
    a{color:inherit;text-decoration:none}
    .hidden{display:none!important}
    .topbar{height:70px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);position:sticky;top:0;z-index:20}
    .nav{max-width:var(--max);height:100%;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.02em}
    .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#4b8cff,#635bdf);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1}
    .navlinks{display:flex;align-items:center;gap:25px;color:#42526a;font-size:14px;font-weight:650}
    .actions{display:flex;align-items:center;gap:10px}
    .btn{border:1px solid transparent;border-radius:9px;min-height:43px;padding:0 17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:780;font-size:14px}
    .btn.primary{background:var(--blue);color:#fff}
    .btn.primary:hover{background:var(--blue2)}
    .btn.secondary{background:#fff;border-color:#cdd7e4;color:#263a54}
    .btn.ghost{background:transparent;color:#3e5068}
    .btn.full{width:100%}
    .hero{max-width:none;margin:0;color:#fff;padding:96px 24px 155px;text-align:center;display:block;position:relative;overflow:hidden;background:
      radial-gradient(circle at 84% 7%,rgba(82,108,244,.4),transparent 33%),
      radial-gradient(circle at 16% 5%,rgba(49,112,236,.25),transparent 35%),
      linear-gradient(135deg,#101c38 0%,#182c5c 55%,#29286c 100%)}
    .hero:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;left:-78px;bottom:28px;background:rgba(86,145,255,.13)}
    .hero:after{content:"";position:absolute;width:240px;height:240px;right:-98px;top:80px;border:1px solid rgba(132,162,255,.23);transform:rotate(20deg)}
    .heroCopy{max-width:980px;margin:auto}
    .heroCopy{position:relative;z-index:2}
    .hero .eyebrow{color:#88b7ff}
    .hero h1{max-width:940px;margin:19px auto 24px;font-size:72px;line-height:.98}
    .hero .lead{max-width:720px;margin:0 auto;color:#d4def2}
    .heroActions{display:flex;justify-content:center;gap:11px;margin-top:30px}
    .heroActions .btn.primary{background:#4389f7;color:#fff;box-shadow:0 10px 24px rgba(34,99,220,.32)}
    .heroActions .btn.primary:hover{background:#2f74e3}
    .heroActions .btn.secondary{color:#fff;background:rgba(255,255,255,.06);border-color:rgba(181,202,255,.35)}
    .eyebrow{color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
    h1{font-size:56px;line-height:1.02;letter-spacing:-.055em;margin:14px 0 22px;max-width:680px}
    h2{font-size:34px;line-height:1.15;letter-spacing:-.035em;margin:10px 0}
    h3{font-size:20px;letter-spacing:-.02em;margin:6px 0}
    p{line-height:1.6}
    .lead{font-size:18px;color:var(--muted);max-width:630px}
    .proof{display:flex;justify-content:center;gap:24px;margin-top:28px;color:#c5d2eb;font-size:13px}
    .proof span{display:flex;gap:7px;align-items:center}
    .check{color:var(--green);font-weight:900}
    .productStage{max-width:1040px;margin:-102px auto 0;padding:0 24px;position:relative;z-index:4}
    .trybox{border:1px solid #cbd2dc;border-radius:12px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.2);overflow:hidden;text-align:left}
    .tryhead{padding:22px 24px 16px;border-bottom:1px solid var(--line)}
    .tryhead strong{font-size:18px}
    .tryhead p{color:var(--muted);font-size:13px;margin:5px 0 0}
    .taskChooser{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;background:#f4f6fa;border-bottom:1px solid var(--line)}
    .taskCard{border:1px solid #d2dae5;border-radius:11px;background:#fff;padding:16px;text-align:left;display:grid;grid-template-columns:38px 1fr;gap:11px;align-items:start;min-height:105px;color:var(--ink)}
    .taskCard:hover{border-color:#91b4ea;transform:translateY(-1px)}
    .taskCard.active{border-color:#2876e3;box-shadow:0 0 0 2px rgba(40,118,227,.1);background:#f7faff}
    .taskIcon{width:38px;height:38px;border-radius:9px;background:#eaf2ff;color:#286dd1;display:grid;place-items:center;font-size:18px}
    .taskCard b{display:block;font-size:13px;margin:1px 0 4px}
    .taskCard small{color:#6d7c91;font-size:11px;line-height:1.4;display:block}
    .quickform{padding:20px 24px 22px}
    .quickTitle{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:14px}
    .quickTitle b{font-size:14px}.quickTitle span{color:#6d7d91;font-size:11px}
    .sourceSwitch{display:flex;gap:6px;margin-bottom:12px}
    .sourceSwitch button,.sourceSwitch a{border:1px solid #d2dbe6;border-radius:7px;background:#fff;padding:7px 10px;color:#617087;font-size:11px;font-weight:750;text-decoration:none}
    .sourceSwitch button.active,.sourceSwitch a.active{background:#eaf2ff;border-color:#8cb3ed;color:#1f63c3}
    .quickAction{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-top:15px}
    .quickAction .btn{min-width:220px}
    .field{display:grid;gap:7px;margin-bottom:14px}
    .field label{font-size:12px;font-weight:800;color:#42536a}
    .field label small{font-weight:500;color:#8190a2}
    .input,select.input,textarea.input{width:100%;border:1px solid #cbd5e2;border-radius:9px;background:#fff;color:var(--ink);min-height:46px;padding:11px 12px;outline:none}
    textarea.input{min-height:105px;resize:vertical}
    .input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,105,224,.11)}
    .helper{font-size:11px;color:#7b899a;margin-top:-4px}
    .trustline{font-size:11px;color:#738197;text-align:center;margin:11px 0 0}
    .metricStrip{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-top:0;background:#fff}
    .metricStrip>div{padding:20px;text-align:center;border-right:1px solid var(--line)}
    .metricStrip>div:last-child{border-right:0}
    .metricStrip strong{display:block;font-size:18px;letter-spacing:-.03em}
    .metricStrip small{display:block;color:#7a8798;margin-top:4px;font-size:11px}
    .section{padding:72px 24px}
    .section.alt{background:var(--wash);border-top:1px solid #edf0f4;border-bottom:1px solid #edf0f4}
    .inner{max-width:var(--max);margin:auto}
    .sectionintro{max-width:760px;margin-bottom:34px}
    .outcomes{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}
    .outcome{padding:28px;border-right:1px solid var(--line)}
    .outcome:last-child{border-right:0}
    .number{font:800 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--blue)}
    .outcome p{color:var(--muted);font-size:14px}
    .textlink{color:var(--blue);font-weight:800;font-size:14px}
    .railHead{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:28px}
    .railHead .sectionintro{margin:0}
    .railControls{display:flex;gap:8px}
    .railControls button{width:43px;height:43px;border:1px solid #cdd6e2;border-radius:50%;background:#fff;color:#263951;font-size:20px}
    .featureRail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 24px}
    .featureRail::-webkit-scrollbar{display:none}
    .mvpFeature{flex:0 0 min(355px,82vw);min-height:285px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:25px;scroll-snap-align:start;display:flex;flex-direction:column;position:relative;overflow:hidden}
    .mvpFeature:before{content:"";height:4px;position:absolute;left:0;right:0;top:0;background:#397ff0}
    .mvpFeature:nth-child(2):before{background:#596de4}.mvpFeature:nth-child(3):before{background:#735ad8}.mvpFeature:nth-child(4):before{background:#387ce7}.mvpFeature:nth-child(5):before{background:#3285ae}
    .mvpFeature .featureIcon{width:42px;height:42px;border-radius:11px;background:#edf4ff;color:#246acb;display:grid;place-items:center;font-size:20px;margin-bottom:22px}
    .mvpFeature .number{margin-bottom:9px}
    .mvpFeature h3{font-size:22px;margin-bottom:10px}
    .mvpFeature p{color:var(--muted);font-size:14px;margin:0 0 19px}
    .mvpFeature ul{padding:0;margin:0 0 22px;list-style:none;display:grid;gap:7px;color:#52637a;font-size:12px}
    .mvpFeature li:before{content:"✓";color:#1769e0;font-weight:900;margin-right:7px}
    .mvpFeature .textlink{margin-top:auto}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:28px}
    .step{padding:0 32px 0 0;position:relative}
    .step:after{content:"";position:absolute;right:16px;top:16px;width:34px;border-top:1px solid #aab7c8}
    .step:last-child:after{display:none}
    .step b{width:32px;height:32px;border:1px solid #aebacc;border-radius:50%;display:grid;place-items:center;margin-bottom:14px}
    .step p{color:var(--muted);font-size:14px}
    .productProof{background:#eef3fb;color:var(--ink);padding:78px 24px;overflow:hidden}
    .productProof .inner{display:grid;grid-template-columns:.75fr 1.25fr;gap:70px;align-items:center;background:#fff;border:1px solid #dce3ea;border-radius:26px;padding:64px;box-shadow:0 20px 55px rgba(28,52,82,.08)}
    .productProof h2{font-size:44px}
    .productProof p{color:#617087}
    .screenStack{position:relative;min-height:440px}
    .mockScreen{position:absolute;background:#fff;color:var(--ink);border:1px solid #cdd6e1;border-radius:12px;overflow:hidden;box-shadow:0 30px 65px rgba(25,50,80,.2)}
    .mockScreen:nth-child(1){width:78%;left:0;top:58px;transform:rotate(-3deg)}
    .mockScreen:nth-child(2){width:82%;right:0;top:0;transform:rotate(2deg)}
    .mockTop{height:37px;background:#f5f5f5;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:5px;padding:0 12px}
    .mockTop i{width:7px;height:7px;border-radius:50%;background:#bbb}
    .mockBody{padding:24px}
    .mockBody small{color:#1769e0;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
    .mockBody h3{font-size:21px;margin:8px 0 14px}
    .mockLine{height:8px;background:#e8edf3;border-radius:99px;margin:9px 0}
    .mockLine.short{width:62%}
    .mockResult{border-left:3px solid #1769e0;background:#f4f7fb;padding:12px;margin-top:18px;font-size:11px;color:#536279}
    footer{background:#0e1f36;color:#dfe7f1;padding:55px 24px}
    .foot{max-width:var(--max);margin:auto;display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:45px}
    .foot p,.foot a{color:#aebbd0;font-size:13px}
    .footlinks{display:grid;gap:9px}
    .view{min-height:calc(100vh - 70px);background:var(--wash)}
    .journeytop{height:66px;background:#fff;border-bottom:1px solid var(--line)}
    .journeytop .nav{max-width:1260px}
    .guesttag{color:#5e6c80;background:#eef2f6;border:1px solid #d9e0e9;border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800}
    .shell{max-width:1060px;margin:auto;padding:42px 24px 70px}
    .progress{display:flex;align-items:center;gap:8px;margin:0 0 30px}
    .progress span{display:flex;align-items:center;gap:7px;color:#8290a2;font-size:12px;font-weight:750}
    .progress span:before{content:"";width:22px;height:22px;border:1px solid #c8d2df;border-radius:50%;display:grid;place-items:center}
    .progress span.active{color:var(--blue)}
    .progress span.active:before{border:6px solid var(--blue)}
    .progress span.done{color:var(--green)}
    .progress span.done:before{content:"✓";border-color:var(--green);font-size:11px}
    .progress i{width:45px;border-top:1px solid #cfd7e1}
    .workspace{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 35px rgba(18,39,70,.06);overflow:hidden}
    .workspacehead{padding:28px 32px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
    .workspacehead p{margin:5px 0 0;color:var(--muted);font-size:14px}
    .body{padding:30px 32px}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 25px}
    .choice{border:1px solid #cfd8e4;border-radius:11px;background:#fff;text-align:left;padding:16px;min-height:90px}
    .choice.active{border-color:var(--blue);background:#f5f9ff;box-shadow:0 0 0 2px rgba(23,105,224,.08)}
    .choice b{display:block;font-size:13px}
    .choice small{display:block;color:#718097;margin-top:5px;line-height:1.4}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .skillEntry{position:relative}
    .skillMenu{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 5px);max-height:250px;overflow:auto;background:#fff;border:1px solid #cbd5e2;border-radius:9px;box-shadow:0 16px 35px rgba(22,44,77,.16);padding:5px}
    .skillOption{display:block;width:100%;border:0;background:#fff;padding:10px 11px;border-radius:6px;text-align:left;color:#31445e;font-size:12px}
    .skillOption:hover,.skillOption.active{background:#eaf2ff;color:#155dbd}
    .skillOption.addNew{border-top:1px solid var(--line);border-radius:0 0 6px 6px;color:#1769e0;font-weight:800}
    .chip{border:1px solid #cad5e2;border-radius:99px;background:#fff;padding:8px 11px;color:#53647b;font-size:12px;font-weight:700}
    .chip.selected{background:#eaf3ff;border-color:#81adeb;color:#185bb8}
    .formactions{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}
    .privacy{color:#718096;font-size:11px;max-width:520px}
    .resultlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
    .resultmain{display:grid;gap:14px}
    .resultsection{padding:22px 0;border-bottom:1px solid var(--line)}
    .resultsection:first-child{padding-top:0}
    .resultsection:last-child{border-bottom:0}
    .label{font-size:11px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
    .evidence{border-left:3px solid var(--blue);background:#f5f8fc;padding:13px 15px;margin-top:12px;color:#45566e;font-size:13px;line-height:1.55}
    .pill{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:850}
    .pill.high{color:var(--green);background:var(--greenwash)}
    .pill.medium{color:var(--amber);background:var(--amberwash)}
    .sidepanel{min-width:0}
    .unlock{border:1px solid #b9cfee;background:linear-gradient(180deg,#f6f9ff 0%,#eef5ff 100%);border-radius:16px;padding:24px;position:sticky;top:92px;box-shadow:0 14px 34px rgba(20,52,103,.10)}
    .unlock h3{font-size:19px;line-height:1.25;margin:10px 0}
    .unlock p{font-size:13px;color:#617188;line-height:1.55}
    .unlock ul{padding-left:18px;color:#4e5f76;font-size:13px;line-height:1.75;margin:16px 0 20px}
    .unlock .btn+.btn{margin-top:8px}
    .previewbar{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#edf7f2;border:1px solid #c8e5d7;border-radius:11px;padding:13px 15px;margin-bottom:24px}
    .previewbar b{font-size:13px;color:#17684c}
    .previewbar span{font-size:11px;color:#57766c}
    .scoreline{display:grid;grid-template-columns:86px 1fr;gap:16px;align-items:center}
    .score{width:82px;height:82px;border:9px solid #d7e8fb;border-top-color:var(--blue);border-radius:50%;display:grid;place-items:center;font-size:23px;font-weight:850}
    .bars{display:grid;gap:11px}
    .bar label{display:flex;justify-content:space-between;font-size:11px;color:#5f6f84;margin-bottom:5px}
    .track{height:7px;border-radius:99px;background:#e7ecf2;overflow:hidden}
    .fill{height:100%;background:var(--blue);border-radius:99px}
    .pivotrow{display:grid;grid-template-columns:35px 1fr auto;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
    .rank{width:30px;height:30px;border-radius:8px;background:#eef3fb;display:grid;place-items:center;font-size:12px;font-weight:850;color:var(--blue)}
    .pivotrow p{font-size:12px;color:var(--muted);margin:4px 0 0}
    .marketstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{background:#f6f8fb;border:1px solid #e0e6ed;border-radius:10px;padding:14px}
    .stat strong{font-size:22px;display:block}
    .stat small{font-size:11px;color:#6f7e91}
    .marketStart{max-width:920px;margin:0 auto}
    .marketStart .flowHeader{margin-bottom:18px}
    .marketStart .flowPanel{padding:24px}
    .marketCompact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .marketCompact .field{margin:0}
    .marketCompact .input{min-height:44px}
    .marketLoading{min-height:430px;display:grid;place-items:center;text-align:center}
    .marketLoading>div{max-width:470px}
    .marketSpinner{width:72px;height:72px;border:7px solid #e6edf8;border-top-color:var(--blue);border-radius:50%;margin:0 auto 24px;animation:marketSpin 1s linear infinite}
    @keyframes marketSpin{to{transform:rotate(360deg)}}
    .marketHero{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;margin-bottom:20px}
    .marketHero h1{font-size:40px;margin:8px 0 10px}
    .marketFreshness{display:flex;flex-wrap:wrap;gap:8px;color:#697a91;font-size:11px;margin-top:12px}
    .marketFreshness span{padding:6px 9px;background:#f2f5f9;border-radius:99px}
    .marketSummary{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:18px}
    .marketTakeaway{border:1px solid var(--line);border-radius:13px;padding:20px;background:#fff}
    .marketTakeaway h3{font-size:17px;margin:8px 0 6px}
    .marketTakeaway p{font-size:13px;color:var(--muted);margin:0}
    .marketSignals{display:grid;gap:10px}
    .marketSignal{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:11px 0}
    .marketSignal:last-child{border-bottom:0}
    .marketSignal b{font-size:13px}.marketSignal small{display:block;color:#76859a;margin-top:3px}
    .reportShelf{margin-top:24px}
    .reportShelfHead{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}
    .reportShelfHead h2{font-size:22px}.reportShelfHead p{font-size:12px;color:var(--muted);margin:3px 0 0}
    .reportList{display:grid;gap:9px}
    .reportItem{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;padding:15px 16px}
    .reportItem b{font-size:13px}.reportItem p{font-size:11px;color:#75849a;margin:3px 0 0}
    .reviewAction{border:0;background:transparent;color:var(--blue);font-weight:800;font-size:12px;padding:7px}
    .snapshotBanner{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff7e7;border:1px solid #f0d69d;border-radius:11px;padding:12px 15px;margin-bottom:18px}
    .snapshotBanner small,.snapshotBanner strong{display:block}
    .snapshotBanner small{font-size:9px;letter-spacing:.1em;color:#8a6418}
    .snapshotBanner strong{font-size:13px;margin-top:3px}
    .latestReportCard{border:1px solid #cad8ee;border-radius:15px;padding:22px;background:linear-gradient(135deg,#fff,#f3f7ff)}
    .latestReportTop{display:flex;justify-content:space-between;align-items:center;gap:16px}
    .latestReportTop h2{font-size:18px;margin:0}
    .latestReportTop p{font-size:12px;color:var(--muted);margin:4px 0 0}
    .latestReportCard .marketstats{margin:18px 0 0}
    .mrWorkspace{max-width:1040px;margin:0 auto}
    .mrPageHead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
    .mrPageHead h1{font-size:36px;line-height:1.08;margin:0 0 8px;letter-spacing:-.035em}
    .mrPageHead p{font-size:13px;color:var(--muted);margin:0}
    .mrSetup{background:#fff;border:1px solid #dce4ee;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(30,55,90,.06)}
    .mrSetupGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .mrSetup .field{margin:0}

        <section class="asideCard"><h3>Appearance</h3><p>Use the account menu to switch between light, dark and system themes.</p><button class="btn secondary full" onclick="toggleAccountMenu()">Choose theme</button></section>
        <section class="asideCard"><h3>Sign out</h3><p>Signing out does not delete saved analyses or Career Profile information.</p><button class="btn secondary full" onclick="requestSignOut()">Sign out</button></section>
      </aside></div></div></section></main>`;
    }
    function route(){
      const h=(location.hash||'#landing').slice(1);
      const routes={'landing':landing,'job-input':()=>processing('job'),'job-review':()=>processing('job'),'job-preview':jobPreview,'pivot-input':()=>processing('pivot'),'pivot-preview':pivotPreview,'signin':signin,'signup':()=>signup('new'),'dashboard-home':()=>home(state.workState==='completed'?'returning-complete':state.workState==='none'?'returning-none':'returning'),'dashboard-returning':()=>home('returning'),'dashboard-returning-none':()=>home('returning-none'),'dashboard-returning-complete':()=>home('returning-complete'),'dashboard-new':()=>home('new'),'career-profile':careerProfile,'account-profile':accountProfile,'skills-match':skillsMatch,'job-workspace-empty':jobWorkspaceEmpty,'job-workspace-history':jobWorkspaceHistory,'job-workspace-new':jobWorkspaceNew,'job-workspace-review':jobWorkspaceGenerating,'job-workspace-generating':jobWorkspaceGenerating,'job-workspace-result':jobWorkspaceResult,'pivot-workspace-empty':pivotWorkspaceEmpty,'pivot-workspace-history':pivotWorkspaceHistory,'pivot-workspace-detail':pivotWorkspaceDetail,'dashboard-market':()=>state.marketHasReports?marketWorkspaceHistory():marketWorkspaceEmpty(),'market-workspace-empty':marketWorkspaceEmpty,'market-workspace-new':marketWorkspaceNew,'market-workspace-generating':marketWorkspaceGenerating,'market-workspace-result':marketWorkspaceResult,'market-workspace-insights':marketWorkspaceResult,'market-workspace-full':marketWorkspaceFullReport,'market-workspace-snapshot':marketWorkspaceResult,'market-workspace-history':marketWorkspaceHistory};
      if(['how','tools','why','pricing'].includes(h)){
        landing();
        setTimeout(()=>document.getElementById(h==='pricing'?'tools':h)?.scrollIntoView(),20);
        return;
      }
      if(h.startsWith('signup-')) return signup(h.replace('signup-',''));
      if(h.startsWith('prototype-new-account-')) return newAccountStep(Math.min(8,Math.max(1,Number(h.replace('prototype-new-account-',''))||1)));
      const guestMarketRoutes=['market-workspace-result'];
      if((h==='dashboard-market'||h.startsWith('market-workspace-'))&&!state.registered&&!guestMarketRoutes.includes(h)){
        state.entryPoint='market-auth-required';
        state.pendingGuest=state.marketGuestReady?'market':null;
        state.postAuthRoute=state.marketGuestReady?'market-workspace-result':null;
        toast('Sign in or create an account to access Market Report.');
        return signin();
      }
      if(h.startsWith('dashboard-')&&['job','pivot'].includes(h.replace('dashboard-',''))) return dashboard(h.replace('dashboard-',''));
      (routes[h]||landing)();
      window.scrollTo(0,0);
    }
    window.addEventListener('hashchange',route);
    route();
  </script>
