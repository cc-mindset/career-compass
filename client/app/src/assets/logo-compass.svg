<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square with shadow effect -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shadow beneath the icon -->
  <ellipse cx="32" cy="66" rx="28" ry="3" fill="#000000" opacity="0.2"/>
  
  <!-- Background rounded square (purple/violet matching the logo) -->
  <rect width="64" height="64" rx="14" fill="#5A45FF" filter="url(#shadow)"/>
  
  <!-- Briefcase icon with centered rectangular handle (white outline, centered) -->
  <g transform="translate(18, 18)" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Main briefcase body (rectangular box) - wider -->
    <rect x="2" y="10" width="20" height="12" rx="1"/>
    
    <!-- Top horizontal line of handle (no bottom line) -->
    <line x1="7" y1="4" x2="17" y2="4"/>
    
    <!-- Left line from handle end all the way down to bottom of box -->
    <line x1="7" y1="4" x2="7" y2="22"/>
    
    <!-- Right line from handle end all the way down to bottom of box -->
    <line x1="17" y1="4" x2="17" y2="22"/>
    
    <!-- Compass hand inside the briefcase (angled, fitting within box only) -->
    <g transform="translate(12, 16) rotate(45)">
      <!-- Main compass needle (north pointer) -->
      <line x1="0" y1="0" x2="0" y2="-2" stroke="white" stroke-width="1.2" opacity="0.95" stroke-linecap="round"/>
      
      <!-- Secondary compass needle (south pointer) -->
      <line x1="0" y1="0" x2="0" y2="2" stroke="white" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
