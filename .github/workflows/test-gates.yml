name: test-gates

on:
  pull_request:
    paths:
      - 'web-server/**'
      - 'client/client/app/**'
      - '.github/workflows/test-gates.yml'

jobs:
  web-server-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-server/package-lock.json
      - run: npm ci
      - run: npm run test:core

  client-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/client/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/client/app/package-lock.json
      - run: npm ci
      - run: npm run test:core

  client-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client/client/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/client/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright pulse + p0
        env:
          CI: 'true'
        run: |
          npm run e2e:pulse
          npm run e2e:p0
